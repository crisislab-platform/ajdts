name: Deploy to GitHub Pages

# site/ is generated by build.py and committed, so a push is all it takes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the build is up to date with its sources
        run: |
          python3 build.py
          if ! git diff --quiet -- site; then
            echo "::error::site/ is stale — run 'python3 build.py' and commit the result"
            git diff --stat -- site
            exit 1
          fi

      # Pages must already be switched on for the repo with Source = GitHub
      # Actions (Settings -> Pages). Enabling it from here needs write-level
      # workflow permissions, which this org does not grant by default.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
